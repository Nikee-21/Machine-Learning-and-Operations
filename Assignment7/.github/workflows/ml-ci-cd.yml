name: Student Placement ML CI-CD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

jobs:

  test:
    name: CI - Train and Test Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train ML Model
        run: python train.py

      - name: Run Automated Tests
        run: pytest -v

      - name: Check Model Accuracy
        run: |
          python -c "import pathlib; a=float(pathlib.Path('artifacts/accuracy.txt').read_text()); print(f'Accuracy: {a*100:.2f}%'); assert a >= 0.80, 'Accuracy below 80%'"

      - name: Test Prediction
        run: python predict.py

  deploy:
    name: CD - Deploy Model
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Model passed all quality checks!"
          echo "Deployment completed successfully!"